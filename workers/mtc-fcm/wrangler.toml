name = "mtc-fcm"
main = "worker.ts"
compatibility_date = "2026-05-01"

# Shared daily budget counter, defined in the mtc-signal worker: deploy
# mtc-signal (which owns the BudgetGuard class) BEFORE this one.
[[durable_objects.bindings]]
name = "BUDGET_GUARD"
class_name = "BudgetGuard"
script_name = "mtc-signal"

[vars]
# Emergency brake: max relayed FCM sends per UTC day. Normal days sit around
# 3k, the Aug 2026 storm peaked near 30k. Tune from the dashboard.
DAILY_FCM_BUDGET = "40000"
