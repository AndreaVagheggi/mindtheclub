name = "mtc-ice"
main = "worker.ts"
compatibility_date = "2026-05-01"

# Shared daily budget counter, defined in the mtc-signal worker: deploy
# mtc-signal (which owns the BudgetGuard class) BEFORE this one.
[[durable_objects.bindings]]
name = "BUDGET_GUARD"
class_name = "BudgetGuard"
script_name = "mtc-signal"


# Automatic brake, native Cloudflare rate limiting: no Durable Object,
# no shared state, counters live in the location serving the request.
# constant key, so per Cloudflare location, not per user
# Needs Wrangler 4.36.0 or later. Two bindings sharing a namespace_id
# share counters, so each worker has its own.
[[ratelimits]]
name = "ICE_LIMITER"
namespace_id = "1002"
simple = { limit = 20000, period = 60 }

[vars]
# Emergency brake: max ICE credential requests per UTC day.
# Sized by worst case SPEND, not by a user forecast, 28 Aug 2026.
#
# The previous values were measured on a four handset test bench and would have
# returned 429 to EVERY user in the world, for the rest of the UTC day, somewhere
# between 120 and 400 real users. A brake that becomes a total outage is worse
# than a bill: a certain failure beats a possible cost.
#
# Measured per user per day on the heaviest handset: 332 FCM, 66 signalling
# rooms, 66 ICE. A guarded request costs about $1.45 per million all in
# (Workers request + Durable Object request + one storage row read and written).
# These ceilings therefore cost at most about $50/month if saturated every single
# day for a month, and they cover roughly 3.000 users.
#
# Raising them is a two minute `npx wrangler deploy`. The budget alerts on the
# Cloudflare account are what warn you before it is needed.
DAILY_ICE_BUDGET = "200000"
